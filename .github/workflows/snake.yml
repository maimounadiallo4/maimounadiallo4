name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # tous les jours à minuit UTC
  workflow_dispatch:        # déclenchement manuel depuis l'onglet Actions
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: maimounadiallo4
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=7aa2f7&color_dots=0,1a1b2e,2ac3de,7aa2f7,bb9af7&color_empty=1a1b2e
            dist/github-contribution-grid-snake-dark.svg?color_snake=bb9af7&color_dots=0,1a1b2e,2ac3de,7aa2f7,bb9af7&color_empty=0d1117

      - name: Push output to branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
